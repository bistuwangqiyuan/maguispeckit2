# Supabase项目配置文件
# 项目: MagSpecKit - 磁检测仪器系统

project_id = "zzyueuweeoakopuuwfau"

[api]
# API配置
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[auth]
# 认证配置
enabled = true
site_url = "http://localhost:8000"
additional_redirect_urls = ["https://yourdomain.com"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
# 邮件认证
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[db]
# 数据库配置
port = 54322
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
# 实时订阅配置
enabled = true
ip_version = "IPv4"

[storage]
# 存储配置
enabled = true
file_size_limit = "50MiB"

[studio]
# Studio配置
enabled = true
port = 54323
api_url = "http://localhost"

[functions]
# Edge Functions配置
enabled = false

[analytics]
# 分析配置
enabled = false

